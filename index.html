<!doctype html>

<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#101827;--muted:#64748b;--line:#dbe3ee;--green:#16a34a;--green2:#dcfce7;--blue:#2563eb;--orange:#f59e0b;--purple:#7c3aed;--red:#e11d48;--cyan:#0891b2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.app{min-height:100vh;padding-bottom:78px}.top{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.96);border-bottom:1px solid var(--line);padding:14px 16px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;color:var(--green)}h1{font-size:23px;margin:4px 0 0}.main{max-width:900px;margin:auto;padding:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:12px;box-shadow:0 7px 20px rgba(15,23,42,.05)}.nav{position:fixed;z-index:50;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:7px 7px calc(7px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;padding:10px 3px;border-radius:11px;font-weight:750;color:var(--muted)}.nav button.on{background:var(--green2);color:#166534}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px}.stat b{display:block;font-size:21px}.stat span{font-size:10px;color:var(--muted)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:7px;margin:12px 0}.toolbar button,.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 11px;font-weight:750}.toolbar h2{font-size:17px;margin:0;text-transform:capitalize}.calendar{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.week,.days{display:grid;grid-template-columns:repeat(7,1fr)}.week div{text-align:center;padding:8px 2px;font-size:10px;font-weight:800;color:var(--muted);border-bottom:1px solid var(--line)}.day{min-height:65px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;text-align:left;padding:6px}.day:nth-child(7n){border-right:0}.day.other{background:#fafafa;color:#94a3b8}.day.today{box-shadow:inset 0 0 0 2px var(--green)}.num{font-size:12px;font-weight:800}.dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}.dot{width:8px;height:8px;border-radius:50%}.power{background:var(--orange)}.tennis{background:var(--blue)}.mobility{background:var(--purple)}.hypertrophy{background:var(--red)}.endurance{background:var(--cyan)}.done{outline:2px solid var(--green);outline-offset:1px}.session{border:1px solid var(--line);border-radius:13px;padding:11px;margin:8px 0}.sessionHead{display:flex;justify-content:space-between;gap:8px}.meta,.desc{font-size:12px;color:var(--muted);line-height:1.45}.badge{font-size:10px;font-weight:800;background:#f1f5f9;border-radius:99px;padding:4px 7px}.exercise{border-top:1px solid var(--line);padding:12px 0}.exercise:first-child{border-top:0}.exercise h4{margin:0 0 3px}.target{font-size:12px;font-weight:800}.labels,.setrow{display:grid;grid-template-columns:38px 1fr 1fr 1fr;gap:5px}.labels{font-size:10px;color:var(--muted);font-weight:700;margin-top:8px}.setrow{margin:5px 0;align-items:center}.setrow input,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px;background:#fff}.field{margin-top:9px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:4px}.field textarea{min-height:68px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.primary{background:var(--ink)!important;color:white!important}.notice{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px;font-size:12px;color:#475569;line-height:1.45}.overlay{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(760px,100%);max-height:93vh;overflow:auto;background:#fff;border-radius:21px 21px 0 0;padding:17px}.close{float:right;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:6px}.choice button{border:1px solid var(--line);background:#f8fafc;border-radius:10px;padding:9px;font-weight:750}.choice button.on{background:var(--green2);border-color:#86efac}.plan{border-left:4px solid var(--line);padding-left:10px;margin:15px 0}.plan h3{margin:0 0 6px}.plan li{margin:5px 0;font-size:13px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 10px;font-weight:750}.tabs button.on{background:var(--ink);color:#fff}.report{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:6px;border-top:1px solid var(--line);padding:9px 0;font-size:12px}
</style>

<body>
<div class="app">
<header class="top"><div class="eyebrow">TENNIS PERFORMANCE</div><h1 id="pageTitle">Trainingskalender</h1></header>
<div id="jsDiag" style="max-width:900px;margin:12px auto;padding:12px;border:1px solid #f59e0b;border-radius:14px;background:#fff7ed;color:#9a3412;font:14px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">Die App startet … Wenn diese Meldung stehen bleibt, ist JavaScript auf diesem Gerät deaktiviert oder wird von Safari blockiert.</div><main class="main" id="main"></main>
<nav class="nav">
<button class="on" data-route="calendar">Kalender</button>
<button data-route="training">Training</button>
<button data-route="reports">Auswertung</button>
<button data-route="plan">Plan</button>
</nav>
</div>
<div id="overlay"></div><noscript><div style="padding:16px;background:#fee2e2;color:#991b1b;font:16px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><b>JavaScript ist deaktiviert.</b><br>Auf iPad: Einstellungen → Apps → Safari → Erweitert → JavaScript einschalten.</div></noscript>
<script>
(function(){
'use strict';
var diag=document.getElementById('jsDiag');if(diag)diag.style.display='none';
var KEY='tennisPerformanceApp1';
var state={route:'calendar',month:new Date(),range:'month',data:load()};
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&x.logs?x:{logs:{},sat:{}}}catch(e){return{logs:{},sat:{}}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state.data))}catch(e){}}
function ex(id,name,target,desc,type,sets){return{id:id,name:name,target:target,desc:desc,type:type,sets:sets||1}}
var E={
cmj:ex('cmj','Countermovement Jumps','3 × 4','Schnell laden, maximal vertikal abspringen, weich landen und vor jeder Wiederholung stabilisieren.','power',3),
lat:ex('lat','Lateral Bounds','3 × 4 je Seite','Explosiv seitlich von einem Bein auf das andere springen; Landung kontrollieren.','power',3),
plyo:ex('plyo','Explosive Liegestütze','3 × 4–6','Rumpf fest, kontrolliert absenken, maximal explosiv wegdrücken; bei Tempoverlust Satz beenden.','power',3),
squat:ex('squat','Langhantel-Kniebeugen','3 × 3–5','Sauber und schwer, etwa 2 Wiederholungen in Reserve. Startgewicht in Woche 1 annähern.','strength',3),
calf:ex('calf','Wadenheben stehend','2 × 8–12','Voller kontrollierter Bewegungsumfang, oben kurz stabilisieren.','strength',2),
pallof:ex('pallof','Pallof Press','2 × 8 je Seite','Seitlich zu Kabel/Band stehen, Arme ausstrecken und Rotation verhindern.','strength',2),
tennis:ex('tennis','Tennistraining','Reguläre Einheit','Dauer, Belastung und Auffälligkeiten dokumentieren.','tennis',1),
intervals:ex('intervals','Tennisspezifische Intervalle','2 Serien × 5 × 15 Sek. / 45 Sek. Pause','15 Sek. intensive tennisspezifische Beinarbeit, 45 Sek. locker; 3 Min. Serienpause. Vormittags locker dosieren.','endurance',1),
broad:ex('broad','Standing Broad Jumps','3 × 3','Explosiv nach vorne springen und stabil auf beiden Füßen landen.','power',3),
rot:ex('rot','Seitliche Medizinball-Rotationswürfe','3 × 4 je Seite','Beine/Hüfte leiten ein, Rumpf explosiv rotieren, Ball schnell gegen geeignete Wand werfen.','power',3),
chest:ex('chest','Medizinball-Brustpässe','3 × 4','Aus Brusthöhe maximal explosiv nach vorne werfen.','power',3),
slam:ex('slam','Medizinball Overhead Slams','3 × 5','Ball über Kopf führen und explosiv zum Boden werfen; Rumpf und Hüfte mitnehmen.','power',3),
copen:ex('copen','Copenhagen Plank','2 × 15–25 Sek. je Seite','Seitstütz, oberes Knie auf Bank, Becken anheben und stabil halten.','stability',2),
bandwalk:ex('bandwalk','Miniband Side Walks','2 × 10–12 Schritte je Seite','Leicht gebeugte Knie, Bandspannung halten und kontrolliert seitwärts gehen.','stability',2),
mob:ex('mob','Allgemeine Mobilisation','5 Min.','Armkreisen, Beinpendel und lockere Ganzkörpermobilisation.','mobility',1),
hip90:ex('hip90','90/90 Hip Switches','2 × 8 Wechsel','Kontrollierte Hüftrotation ohne Schwung.','mobility',2),
cossack:ex('cossack','Cossack Squats','2 × 6 je Seite','Breiter Stand, kontrolliert seitlich absenken.','mobility',2),
knee:ex('knee','Knee-to-Wall','2 × 10 je Seite','Knie Richtung Wand führen, Ferse bleibt am Boden.','mobility',2),
calfstretch:ex('calfstretch','Wadendehnung','2 × 30 Sek. je Seite','Ferse unten, sanft nach vorne verlagern.','mobility',2),
open:ex('open','Open Books','1 × 8 je Seite','Brustwirbelsäule rotieren, Becken stabil halten.','mobility',1),
wall:ex('wall','Wall Slides','2 × 10','Arme kontrolliert an der Wand nach oben führen, nicht ins Hohlkreuz ausweichen.','mobility',2),
ero:ex('ero','Schulter-Außenrotation am Kabelzug','2 × 12–15 je Seite','Ellenbogen ca. 90° nah am Körper, Unterarm nach außen rotieren, Oberkörper ruhig; leicht bis moderat und schmerzfrei.','strength',2),
cool:ex('cool','Lockeres Cool-down','6 Min.','Ruhige Schulter-/Hüftbewegungen und entspannte Atmung.','mobility',1),
pull:ex('pull','Klimmzüge','3 × 6–10','Sauber aus dem Hang ziehen; wenn 3 × 10 mit Reserve gelingt, Widerstand erhöhen.','hypertrophy',3),
dips:ex('dips','Dips','3 × 6–10','Kontrolliert absenken, nur schmerzfreie Tiefe, kräftig hochdrücken.','hypertrophy',3),
bulg:ex('bulg','Bulgarian Split Squats','2 × 8–12 je Bein','Kontrolliert absenken, Samstag moderat halten.','hypertrophy',2),
aus:ex('aus','Australian Pull-ups','3 × 8–12','Körper als Linie halten und Brust zur Stange ziehen.','hypertrophy',3),
pike:ex('pike','Pike Push-ups','2 × 6–10','Hüfte hoch, Kopf kontrolliert Richtung Boden, kräftig wegdrücken.','hypertrophy',2),
glute:ex('glute','Einbeinige Glute Bridges','2 × 10–15 je Seite','Becken über Gesäß/Hinterkette anheben, oben stabilisieren.','hypertrophy',2),
blat:ex('blat','Seitheben mit Widerstandsband','2 × 10–15','Arme kontrolliert seitlich anheben, Schultern unten halten.','hypertrophy',2),
bench:ex('bench','Langhantel-Bankdrücken','3 × 6–10','Schulterblätter stabil, kontrolliert absenken und kräftig hochdrücken.','hypertrophy',3),
row:ex('row','Einarmiges Kurzhantelrudern','3 × 8–12 je Seite','Rücken stabil, Hantel Richtung Hüfte ziehen.','hypertrophy',3),
rdl:ex('rdl','Rumänisches Kreuzheben','2 × 8–10','Knie leicht gebeugt, Hüfte nach hinten, Rücken neutral.','hypertrophy',2),
shoulder:ex('shoulder','Kurzhantel-Schulterdrücken','2 × 8–10','Rumpf stabil, kontrolliert über Kopf drücken.','hypertrophy',2),
dblat:ex('dblat','Kurzhantel-Seitheben','2 × 10–15','Kontrolliert seitlich anheben, ohne Schwung.','hypertrophy',2),
pullover:ex('pullover','Kurzhantel-Pullover','2 × 8–12','Auf Bank liegend kontrolliert hinter den Kopf führen und zurück.','hypertrophy',2),
run:ex('run','Lockerer Dauerlauf','30–45 Min. · RPE 3–4/10','Gleichmäßiges Gesprächstempo; bei Bedarf zunächst 20–25 Min.','endurance',1)
};
var SAT_A=[E.pull,E.dips,E.bulg,E.aus,E.pike,E.glute,E.blat];
var SAT_B=[E.bench,E.row,E.rdl,E.bulg,E.shoulder,E.dblat,E.pullover];
function session(id,title,sub,cat,list){return{id:id,title:title,sub:sub,cat:cat,list:list}}
var S={
mon:session('mon','Schnellkraft & Maximalkraft A','Kraftraum · Unterkörperfokus','power',[E.cmj,E.lat,E.plyo,E.squat,E.calf,E.pallof]),
wed:session('wed','Tennistraining','Reguläre Einheit','tennis',[E.tennis]),
thuAM:session('thuAM','Tennisspezifische Intervalle','Donnerstagvormittag · locker','endurance',[E.intervals]),
thuPM:session('thuPM','Schnellkraft B','Donnerstagabend · Oberkörper & Rotation','power',[E.broad,E.rot,E.chest,E.slam]),
fri:session('fri','Tennis-Mobility & Schulter','Freitag 13:00–13:45 · ARO einzige Kraftübung','mobility',[E.mob,E.hip90,E.cossack,E.knee,E.calfstretch,E.open,E.wall,E.ero,E.cool]),
sun:session('sun','Lockerer Dauerlauf','Grundlagenausdauer','endurance',[E.run])
};
function pad(n){return n<10?'0'+n:String(n)}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseIso(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function add(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function weekNo(d){var x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);var y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}
function stability(d){return weekNo(d)%2===0?E.copen:E.bandwalk}
function sessions(d){var w=d.getDay();if(w===1)return[S.mon];if(w===3)return[S.wed];if(w===4)return[S.thuAM,session('thuPM',S.thuPM.title,S.thuPM.sub,S.thuPM.cat,S.thuPM.list.concat([stability(d)]))];if(w===5)return[S.fri];if(w===6){var c=state.data.sat[iso(d)]||'A';return[session('sat'+c,'Ganzkörper-Hypertrophie '+c,c==='A'?'Calisthenics-Park':'Langhantel · Bank · Kurzhanteln','hypertrophy',c==='A'?SAT_A:SAT_B)]}if(w===0)return[S.sun];return[]}
function key(d,s){return iso(d)+'|'+s.id}
function logOf(d,s){return state.data.logs[key(d,s)]||null}
function done(d,s){var l=logOf(d,s);return !!(l&&l.completed)}
function fmt(d,opt){var wd=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];var wds=['So','Mo','Di','Mi','Do','Fr','Sa'];var mo=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];var out=[];if(opt&&opt.weekday)out.push(opt.weekday==='short'?wds[d.getDay()]:wd[d.getDay()]);if(opt&&opt.day)out.push(pad(d.getDate())+(opt.month==='2-digit'?'.':''));if(opt&&opt.month==='long')out.push(mo[d.getMonth()]);else if(opt&&opt.month==='2-digit')out.push(pad(d.getMonth()+1)+(opt.year?'.':''));if(opt&&opt.year)out.push(String(d.getFullYear()));return out.join(' ')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function startWeek(d){var x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function weekly(){var st=startWeek(new Date()),p=0,c=0;for(var i=0;i<7;i++){var d=add(st,i),ss=sessions(d);p+=ss.length;for(var j=0;j<ss.length;j++)if(done(d,ss[j]))c++}return{p:p,c:c,pc:p?Math.round(c/p*100):0}}
var main=document.getElementById('main'), pageTitle=document.getElementById('pageTitle'), overlay=document.getElementById('overlay');
function nav(route){state.route=route;var bs=document.querySelectorAll('.nav button');for(var i=0;i<bs.length;i++)if(bs[i].getAttribute('data-route')===route){bs[i].classList.add('on')}else{bs[i].classList.remove('on')};render()}
function render(){if(state.route==='calendar')renderCalendar();else if(state.route==='training')renderTraining();else if(state.route==='reports')renderReports();else renderPlan()}
function renderCalendar(){pageTitle.textContent='Trainingskalender';var a=state.month,y=a.getFullYear(),m=a.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),start=add(first,-((first.getDay()+6)%7)),end=add(last,6-((last.getDay()+6)%7)),w=weekly(),h='<div class="stats"><div class="stat"><b>'+w.p+'</b><span>geplant diese Woche</span></div><div class="stat"><b>'+w.c+'</b><span>abgeschlossen</span></div><div class="stat"><b>'+w.pc+'%</b><span>Fortschritt</span></div></div><div class="toolbar"><div><button id="prev">‹</button> <button id="today">Heute</button></div><h2>'+fmt(a,{month:'long',year:'numeric'})+'</h2><button id="next">›</button></div><div class="calendar"><div class="week"><div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div></div><div class="days">';
for(var d=new Date(start);d<=end;d=add(d,1)){var ss=sessions(d),dots='';for(var i=0;i<ss.length;i++)dots+='<span class="dot '+ss[i].cat+(done(d,ss[i])?' done':'')+'"></span>';h+='<button class="day '+(d.getMonth()!==m?'other ':'')+(iso(d)===iso(new Date())?'today':'')+'" data-date="'+iso(d)+'"><span class="num">'+d.getDate()+'</span><div class="dots">'+dots+'</div></button>'}
h+='</div></div><div class="notice" style="margin-top:10px">Tippe auf einen Tag, um die Einheit zu öffnen und zu protokollieren.</div>';main.innerHTML=h;
document.getElementById('prev').onclick=function(){state.month=new Date(y,m-1,1);renderCalendar()};document.getElementById('next').onclick=function(){state.month=new Date(y,m+1,1);renderCalendar()};document.getElementById('today').onclick=function(){state.month=new Date();renderCalendar()};
var ds=document.querySelectorAll('.day');for(var k=0;k<ds.length;k++)ds[k].onclick=function(){openDay(parseIso(this.getAttribute('data-date')))}
}
function cards(d,ss){var h='';for(var i=0;i<ss.length;i++)h+='<div class="session"><div class="sessionHead"><div><b>'+esc(ss[i].title)+'</b><div class="meta">'+esc(ss[i].sub)+'</div></div><span class="badge">'+esc(ss[i].cat)+'</span></div><div class="actions"><button class="btn open" data-id="'+ss[i].id+'">'+(done(d,ss[i])?'Eintrag öffnen':'Training öffnen')+'</button></div></div>';return h}
function wire(d,scope){scope=scope||document;var bs=scope.querySelectorAll('.open');for(var i=0;i<bs.length;i++)bs[i].onclick=function(){var id=this.getAttribute('data-id'),ss=sessions(d);for(var j=0;j<ss.length;j++)if(ss[j].id===id){openSession(d,ss[j]);break}}}
function renderTraining(){pageTitle.textContent='Training';var d=new Date(),ss=sessions(d),h='<div class="card"><div class="eyebrow">HEUTE</div><h2>'+fmt(d,{weekday:'long',day:'2-digit',month:'long',year:'numeric'})+'</h2>'+(ss.length?cards(d,ss):'<p>Heute ist laut Plan trainingsfrei.</p>')+'</div><div class="card"><h3>Nächste Einheiten</h3>';var c=0;for(var i=1;i<10&&c<5;i++){var x=add(d,i),xs=sessions(x);for(var j=0;j<xs.length&&c<5;j++,c++)h+='<div class="session"><b>'+esc(xs[j].title)+'</b><div class="meta">'+fmt(x,{weekday:'short',day:'2-digit',month:'2-digit'})+' · '+esc(xs[j].sub)+'</div></div>'}main.innerHTML=h+'</div>';wire(d)}
function openDay(d){var ss=sessions(d),h='<div class="overlay"><div class="sheet"><button class="close" id="closeDay">×</button><div class="eyebrow">'+fmt(d,{weekday:'long'}).toUpperCase()+'</div><h2>'+fmt(d,{day:'2-digit',month:'long',year:'numeric'})+'</h2>';if(d.getDay()===6){var c=state.data.sat[iso(d)]||'A';h+='<div class="card"><b>Samstagsvariante</b><div class="choice"><button data-c="A" class="'+(c==='A'?'on':'')+'">A · Calisthenics</button><button data-c="B" class="'+(c==='B'?'on':'')+'">B · Hanteln</button></div></div>'}h+=ss.length?cards(d,ss):'<div class="notice">Trainingsfreier Tag.</div>';overlay.innerHTML=h+'</div></div>';document.getElementById('closeDay').onclick=function(){overlay.innerHTML=''};if(d.getDay()===6){var cs=overlay.querySelectorAll('[data-c]');for(var i=0;i<cs.length;i++)cs[i].onclick=function(){state.data.sat[iso(d)]=this.getAttribute('data-c');save();openDay(d)}}wire(d,overlay)}
function openSession(d,s){var old=logOf(d,s)||{},h='<div class="overlay"><div class="sheet"><button class="close" id="closeSession">×</button><div class="eyebrow">'+fmt(d,{weekday:'long'}).toUpperCase()+'</div><h2>'+esc(s.title)+'</h2><div class="meta">'+esc(s.sub)+'</div><form id="form">';
for(var i=0;i<s.list.length;i++){var e=s.list[i],saved=old.exercises&&old.exercises[e.id]?old.exercises[e.id]:{},sets=saved.sets||[];h+='<div class="exercise"><h4>'+esc(e.name)+'</h4><div class="target">'+esc(e.target)+'</div><div class="desc">'+esc(e.desc)+'</div>';if(e.type==='mobility'||e.type==='tennis'||e.type==='endurance'){h+='<div class="field"><label>Notiz / Ergebnis</label><input name="note_'+e.id+'" value="'+esc(saved.note||'')+'" placeholder="z. B. Dauer, RPE, Besonderheiten"></div>'}else{h+='<div class="labels"><span>Satz</span><span>Wdh.</span><span>Gewicht</span><span>RIR</span></div>';for(var k=0;k<e.sets;k++){var v=sets[k]||{};h+='<div class="setrow"><b>'+(k+1)+'</b><input inputmode="decimal" name="rep_'+e.id+'_'+k+'" value="'+esc(v.reps||'')+'"><input inputmode="decimal" name="kg_'+e.id+'_'+k+'" value="'+esc(v.kg||'')+'" placeholder="kg"><input inputmode="decimal" name="rir_'+e.id+'_'+k+'" value="'+esc(v.rir||'')+'"></div>'}h+='<div class="field"><label>Qualität / Notiz</label><input name="note_'+e.id+'" value="'+esc(saved.note||'')+'" placeholder="explosiv, sauber, früh ermüdet …"></div>'}h+='</div>'}
h+='<div class="field"><label>Tagesform</label><select name="fatigue"><option value="">Bitte wählen</option><option value="fit">Fit und leistungsfähig</option><option value="normal">Normale Ermüdung</option><option value="early">Früher ermüdet als sonst</option><option value="technique">Technik ließ nach</option></select></div><div class="field"><label>Allgemeine Notizen</label><textarea name="notes">'+esc(old.notes||'')+'</textarea></div><div class="field"><label><input type="checkbox" name="completed" '+(old.completed?'checked':'')+'> Einheit abgeschlossen</label></div><div class="actions"><button class="btn primary" type="submit">Speichern</button><button class="btn" type="button" id="delete">Eintrag löschen</button></div></form></div></div>';overlay.innerHTML=h;
var form=document.getElementById('form');if(old.fatigue)form.elements.fatigue.value=old.fatigue;document.getElementById('closeSession').onclick=function(){overlay.innerHTML=''};form.onsubmit=function(ev){ev.preventDefault();var fd=new FormData(form),obj={completed:form.elements.completed.checked,fatigue:fd.get('fatigue')||'',notes:fd.get('notes')||'',exercises:{}};for(var i=0;i<s.list.length;i++){var e=s.list[i],eo={note:fd.get('note_'+e.id)||'',sets:[]};if(!(e.type==='mobility'||e.type==='tennis'||e.type==='endurance'))for(var k=0;k<e.sets;k++)eo.sets.push({reps:fd.get('rep_'+e.id+'_'+k)||'',kg:fd.get('kg_'+e.id+'_'+k)||'',rir:fd.get('rir_'+e.id+'_'+k)||''});obj.exercises[e.id]=eo}state.data.logs[key(d,s)]=obj;save();overlay.innerHTML='';render()};document.getElementById('delete').onclick=function(){delete state.data.logs[key(d,s)];save();overlay.innerHTML='';render()}
}
function rangeDates(now,r){var y=now.getFullYear(),m=now.getMonth();if(r==='month')return[new Date(y,m,1),new Date(y,m+1,0,23,59,59)];if(r==='quarter'){var q=Math.floor(m/3)*3;return[new Date(y,q,1),new Date(y,q+3,0,23,59,59)]}if(r==='half'){var h=m<6?0:6;return[new Date(y,h,1),new Date(y,h+6,0,23,59,59)]}return[new Date(y,0,1),new Date(y,11,31,23,59,59)]}
function renderReports(){pageTitle.textContent='Auswertung';var tabs='<div class="tabs"><button data-r="month" class="'+(state.range==='month'?'on':'')+'">Monat</button><button data-r="quarter" class="'+(state.range==='quarter'?'on':'')+'">Quartal</button><button data-r="half" class="'+(state.range==='half'?'on':'')+'">6 Monate</button><button data-r="year" class="'+(state.range==='year'?'on':'')+'">Jahr</button></div>',rg=rangeDates(new Date(),state.range),rows={},complete=0,total=0,names={};for(var n in E)names[E[n].id]=E[n].name;
for(var k in state.data.logs){var date=parseIso(k.split('|')[0]);if(date<rg[0]||date>rg[1])continue;var l=state.data.logs[k];total++;if(l.completed)complete++;for(var id in l.exercises){var eo=l.exercises[id],bestR=0,bestKg=0;if(eo.sets)for(var i=0;i<eo.sets.length;i++){var r=parseFloat(eo.sets[i].reps)||0,kg=parseFloat(eo.sets[i].kg)||0;if(r>bestR||(r===bestR&&kg>bestKg)){bestR=r;bestKg=kg}}if(bestR||bestKg){if(!rows[id])rows[id]={first:null,last:null};var p={d:date,r:bestR,kg:bestKg};if(!rows[id].first||date<rows[id].first.d)rows[id].first=p;if(!rows[id].last||date>rows[id].last.d)rows[id].last=p}}}
var h=tabs+'<div class="stats"><div class="stat"><b>'+complete+'</b><span>abgeschlossen</span></div><div class="stat"><b>'+total+'</b><span>protokolliert</span></div><div class="stat"><b>'+fmt(rg[0],{day:'2-digit',month:'2-digit'})+'</b><span>Zeitraum ab</span></div></div><div class="card"><h3>Übungsentwicklung</h3>',count=0;for(var id in rows){count++;var a=rows[id].first,b=rows[id].last;h+='<div class="report"><b>'+esc(names[id]||id)+'</b><span>'+a.r+(a.kg?' @ '+a.kg+' kg':'')+'</span><span>→ '+b.r+(b.kg?' @ '+b.kg+' kg':'')+'</span></div>'}if(!count)h+='<p>Noch nicht genug protokollierte Kraftdaten in diesem Zeitraum.</p>';main.innerHTML=h+'</div><div class="notice">Gewicht und Wiederholungen werden gemeinsam angezeigt, damit Fortschritt bei gleicher Last und nach Gewichtssteigerungen sichtbar bleibt.</div>';var bs=document.querySelectorAll('[data-r]');for(var j=0;j<bs.length;j++)bs[j].onclick=function(){state.range=this.getAttribute('data-r');renderReports()}}
function block(day,name,list){var h='<div class="plan"><h3>'+esc(day)+' · '+esc(name)+'</h3><ul>';for(var i=0;i<list.length;i++)h+='<li><b>'+esc(list[i].name)+'</b> – '+esc(list[i].target)+'</li>';return h+'</ul></div>'}
function renderPlan(){pageTitle.textContent='Trainingsplan';var thu=add(startWeek(new Date()),3),stab=stability(thu),h='<div class="card"><h2>Wochenübersicht</h2><div class="notice">Dienstag frei. Donnerstag hat zwei getrennte Einheiten. Samstag A oder B je nach Equipment.</div>';h+=block('Montag','Schnellkraft & Maximalkraft A',S.mon.list)+block('Mittwoch','Tennis',[E.tennis])+block('Donnerstag vormittags','Tennisspezifische Intervalle',[E.intervals])+block('Donnerstag abends','Schnellkraft B',S.thuPM.list.concat([stab]))+block('Freitag 13:00–13:45','Tennis-Mobility & Schulter',S.fri.list)+block('Samstag A','Hypertrophie · Calisthenics',SAT_A)+block('Samstag B','Hypertrophie · Hanteln',SAT_B)+block('Sonntag','Lockerer Dauerlauf',[E.run]);h+='</div><div class="card"><h3>Datensicherung</h3><div class="actions"><button id="export" class="btn">Backup herunterladen</button><label class="btn">Backup importieren<input id="import" type="file" accept="application/json" style="display:none"></label></div></div>';main.innerHTML=h;document.getElementById('export').onclick=function(){var blob=new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='tennis-performance-backup.json';a.click();setTimeout(function(){URL.revokeObjectURL(u)},1000)};document.getElementById('import').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x.logs)throw 0;state.data=x;save();alert('Backup importiert');renderPlan()}catch(e){alert('Import fehlgeschlagen')}};r.readAsText(f)}}
var ns=document.querySelectorAll('.nav button');for(var i=0;i<ns.length;i++)ns[i].onclick=function(){nav(this.getAttribute('data-route'))};
try{render()}catch(e){main.innerHTML='<div class="card"><h2>Startfehler</h2><p>'+esc(e.message||e)+'</p></div>'}
})();
</script>
