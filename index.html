<style id="calendar-regression-guard">

.calendar .day .daySession,
.calendar .day .daySession.strength,
.calendar .day .daySession.hypertrophy,
.calendar .day .daySession.power,
.calendar .day .daySession.tennis,
.calendar .day .daySession.endurance,
.calendar .day .daySession.mobility,
.calendar .day .dayFocus .daySession{
 background:transparent!important;
 background-color:transparent!important;
 color:#64748b!important;
 border:0!important;
 box-shadow:none!important;
 padding:0!important;
 display:block!important;
 font-size:9px!important;
 line-height:1.2!important;
 overflow-wrap:anywhere!important;
}
.calendar .day .dayFocus{background:transparent!important}
</style>

<body>
<div class="app">
  <header class="top">
    <div class="topline">
      <div>
        <div class="eyebrow">TENNIS PERFORMANCE</div>
        <h1 id="pageTitle">Trainingskalender</h1>
      </div>
      <div class="headerActions"><button class="themeToggle" id="themeToggle" type="button" aria-label="Designmodus wechseln">☀️ Light</button><button class="sync sync-off" id="syncStatus" type="button">Sync: anmelden</button></div>
    </div>
  </header>
  <div id="jsDiag" style="max-width:920px;margin:12px auto;padding:12px;border:1px solid #f59e0b;border-radius:14px;background:#fff7ed;color:#9a3412;font:14px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">

  </div>
  <main class="main" id="main"></main>
  <nav class="nav">
    <button class="on" data-route="start">Start</button>
    <button data-route="calendar">Kalender</button>
    <button data-route="training">Training</button>
    <button data-route="reports">Analyse</button>
    <button data-route="plan">Plan</button>
    
  </nav>
</div>
<div id="overlay"></div>
