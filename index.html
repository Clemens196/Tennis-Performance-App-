<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tennis Performance">
<title>Tennis Performance</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css?v=10">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="topline">
      <div>
        <div class="eyebrow">TENNIS PERFORMANCE</div>
        <h1 id="pageTitle">Trainingskalender</h1>
      </div>
      <button class="sync sync-off" id="syncStatus" type="button">Sync: anmelden</button>
    </div>
  </header>
  <div id="jsDiag" style="max-width:920px;margin:12px auto;padding:12px;border:1px solid #f59e0b;border-radius:14px;background:#fff7ed;color:#9a3412;font:14px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    Die App startet … Wenn diese Meldung stehen bleibt, wurde JavaScript auf diesem Gerät nicht geladen.
  </div>
  <main class="main" id="main"></main>
  <nav class="nav">
    <button class="on" data-route="calendar">Kalender</button>
    <button data-route="training">Training</button>
    <button data-route="reports">Auswertung</button>
    <button data-route="plan">Plan</button>
  </nav>
</div>
<div id="overlay"></div>
<noscript>
  <div style="padding:16px;background:#fee2e2;color:#991b1b;font:16px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <b>JavaScript ist deaktiviert.</b><br>Bitte JavaScript in Safari aktivieren.
  </div>
</noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./planner.js?v=3"></script>
